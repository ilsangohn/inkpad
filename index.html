<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="강의 노트">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>강의 노트</title>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></symbol>
      <symbol id="i-hl" viewBox="0 0 24 24"><path d="M4 21h7"/><path d="M7 17l2-5 8-8 3 3-8 8z"/><path d="M7 17l2 2"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M9 20h11"/><path d="M5.3 15.3l9-9a2 2 0 0 1 2.8 0l2.6 2.6a2 2 0 0 1 0 2.8L11 20H9l-3.7-3.7a.7.7 0 0 1 0-1z"/><path d="M9.5 11l5 5"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 13L4 8l5-5"/><path d="M4 8h10a6 6 0 0 1 0 12h-3"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 13l5-5-5-5"/><path d="M20 8H10a6 6 0 0 0 0 12h3"/></symbol>
      <symbol id="i-addpage" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v7M8.5 13.5h7"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    </defs>
  </svg>

  <section id="library" class="view">
    <header class="lib-head">
      <h1>강의 노트</h1>
      <div class="lib-actions">
        <button id="btn-new-blank" class="btn">빈 노트</button>
        <label class="btn primary">PDF 열기<input id="file-input" type="file" accept="application/pdf,.pdf" hidden></label>
      </div>
    </header>
    <div id="doc-list" class="doc-list"></div>
    <p id="lib-empty" class="lib-empty" hidden>PDF를 열거나 빈 노트를 만들어 시작하세요.<br>필기는 이 iPad 안에 자동으로 저장됩니다.</p>
    <p class="app-version lib-foot"></p>
  </section>

  <section id="editor" class="view" hidden>
    <header class="toolbar">
      <div class="tb-group tb-left">
        <button class="icon" id="btn-back" aria-label="보관함"><svg><use href="#i-back"/></svg></button>
        <button class="doc-title" id="doc-title"></button>
        <span class="save-state" id="save-state"></span>
      </div>
      <div class="tb-group tb-tools">
        <button class="icon tool" data-tool="pen" aria-label="펜"><svg><use href="#i-pen"/></svg></button>
        <button class="icon tool" data-tool="hl" aria-label="형광펜"><svg><use href="#i-hl"/></svg></button>
        <button class="icon tool" data-tool="eraser" aria-label="지우개"><svg><use href="#i-eraser"/></svg></button>
        <span class="sep"></span>
        <div id="swatches" class="swatches"></div>
        <span class="sep"></span>
        <div id="sizes" class="sizes"></div>
      </div>
      <div class="tb-group tb-right">
        <button class="icon" id="btn-undo" aria-label="실행 취소"><svg><use href="#i-undo"/></svg></button>
        <button class="icon" id="btn-redo" aria-label="다시 실행"><svg><use href="#i-redo"/></svg></button>
        <button class="icon" id="btn-addpage" aria-label="빈 페이지 추가"><svg><use href="#i-addpage"/></svg></button>
        <button class="icon" id="btn-export" aria-label="내보내기"><svg><use href="#i-share"/></svg></button>
        <button class="icon" id="btn-more" aria-label="더보기"><svg><use href="#i-more"/></svg></button>
      </div>
    </header>
    <div class="stage" id="stage">
      <div id="scroller"><div id="pages"></div></div>
      <canvas id="live"></canvas>
      <div id="scrub" hidden><div id="scrub-thumb"></div></div>
      <div id="page-indicator"></div>
    </div>
  </section>

  <div id="menu" class="menu" hidden>
    <button data-act="fit">폭에 맞추기</button>
    <div class="menu-row">
      <button data-act="zoom-out">축소 −</button>
      <button data-act="zoom-in">확대 +</button>
    </div>
    <button data-act="finger" class="toggle">손가락으로 필기 <span class="state"></span></button>
    <hr>
    <button data-act="add-page">현재 페이지 뒤에 빈 페이지</button>
    <button data-act="delete-page" class="danger">현재 페이지 삭제</button>
    <hr>
    <button data-act="rename">이름 바꾸기</button>
    <div class="app-version menu-foot"></div>
  </div>

  <div id="palette" class="menu palette" hidden></div>

  <dialog id="export-dialog">
    <form method="dialog">
      <h2>PDF 준비 완료</h2>
      <p id="export-info"></p>
      <div class="dlg-actions">
        <button value="share" class="btn primary" id="btn-share">공유 · 업로드</button>
        <button value="download" class="btn">다운로드</button>
        <button value="cancel" class="btn ghost">닫기</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
